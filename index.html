<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mapping Matter · Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* BrandOS tokens — accents/type theme-independent; surfaces swap per [data-theme].
   Source: Areas/Disguise BrandOS — Tokens (Colour / Typography / Octopus). */
:root{
  --magenta:#FF6DF0; --magenta-light:#FF98F4; --green:#6BFFDC; --purple:#8200E8; --orange:#FF8559;
  --maglight-soft:rgba(107,255,220,.16); --maglight-line:rgba(107,255,220,.5);
  --green-soft:rgba(107,255,220,.14); --green-line:rgba(107,255,220,.45);
  --orange-soft:rgba(255,133,89,.13); --orange-line:rgba(255,133,89,.45);
  --font-display:'Aeonik','Inter',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'Aeonik Mono','Inter',sans-serif;
  --topbar:60px; --cta-text:#101828;
}
html[data-theme="dark"]{
  --bg:#0B0E15; --bg-2:#101828; --surface:#151C29; --surface-2:#1D2939; --surface-3:#27344A;
  --line:#222C3D; --line-2:#2E3A4F; --line-3:#3C4A62;
  --text:#F2F4F7; --text-2:#98A2B3; --text-3:#667085;
  --green-ink:#6BFFDC; --orange-ink:#FF8559;
  --glow-1:rgba(107,255,220,.06); --glow-2:rgba(130,0,232,.08);
  --card-shadow:0 22px 44px -20px rgba(0,0,0,.72); --topbar-bg:rgba(11,14,21,.82); --grid:#1D2939;
}
html[data-theme="light"]{
  --bg:#F9FAFB; --bg-2:#F2F4F7; --surface:#FFFFFF; --surface-2:#F8FAFC; --surface-3:#F2F4F7;
  --line:#EAECF0; --line-2:#D0D5DD; --line-3:#98A2B3;
  --text:#101828; --text-2:#475467; --text-3:#667085;
  --green-ink:#067A5E; --orange-ink:#B8431F;
  --glow-1:rgba(107,255,220,.10); --glow-2:rgba(130,0,232,.05);
  --card-shadow:0 18px 36px -18px rgba(16,24,40,.16); --topbar-bg:rgba(249,250,251,.82); --grid:rgba(29,41,57,0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);
  background-image:radial-gradient(1100px 560px at 82% -8%, var(--glow-1) 0%, transparent 58%),radial-gradient(900px 500px at 12% -4%, var(--glow-2) 0%, transparent 55%);
  background-attachment:fixed;color:var(--text-2);font-family:var(--font-body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;transition:background-color .3s,color .3s}
::selection{background:var(--green);color:#101828}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ===== TOP BAR ===== */
.topbar{position:sticky;top:0;z-index:60;height:var(--topbar);display:flex;align-items:center;gap:18px;padding:0 22px;
  background:var(--topbar-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:13px;flex-shrink:0}
.brand .dmark{height:44px;width:auto;color:var(--text);display:block}
.brand .dmark-min{display:none;height:26px;width:auto;color:var(--text)}
.brand .sep{width:1px;height:22px;background:var(--line-2)}
.lens{display:flex;align-items:center;gap:9px}
.lens .ico{width:26px;height:26px;flex-shrink:0;display:block}
.lens .ico svg{width:100%;height:100%;display:block}
.lens .name{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--text);letter-spacing:-.01em;line-height:1}
.lens .ver{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;color:var(--magenta-ink,var(--green-ink));border:1px solid var(--maglight-line);border-radius:5px;padding:2px 5px;line-height:1;margin-left:2px}
.tb-search{flex:0 1 340px;min-width:120px;margin:0;position:relative}
.tb-search input{width:100%;height:36px;border-radius:9px;background:var(--surface);border:1px solid var(--line-2);color:var(--text);font-size:13.5px;padding:0 12px 0 36px;transition:border-color .15s}
.tb-search input::placeholder{color:var(--text-3)}
.tb-search input:focus{outline:none;border-color:var(--line-3)}
.tb-search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-3);pointer-events:none}
.tb-search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-size:10px;color:var(--text-3);border:1px solid var(--line-2);border-radius:4px;padding:2px 6px;background:var(--bg-2)}
.tb-right{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:auto}
.iconbtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--text-2);transition:background .15s,color .15s;position:relative}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn svg{width:17px;height:17px}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--magenta-light);border:1.5px solid var(--bg)}
html[data-theme="dark"] .icon-moon{display:none}
html[data-theme="light"] .icon-sun{display:none}
.userbtn{display:flex;align-items:center;gap:9px;height:36px;padding:0 9px 0 6px;border-radius:10px;transition:background .15s}
.userbtn:hover{background:var(--surface-2)}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(140deg,var(--magenta-light),var(--magenta));color:#101828;font-weight:600;font-size:12px;font-family:var(--font-display)}
.userbtn .un{font-size:13.5px;color:var(--text);font-weight:500}
.userbtn .chev{width:14px;height:14px;color:var(--text-3)}

/* ===== DROPDOWNS ===== */
.menu{position:absolute;z-index:120;background:var(--surface);border:1px solid var(--line-2);border-radius:13px;box-shadow:var(--card-shadow);padding:7px;min-width:230px;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .14s,transform .14s;transform-origin:top right}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu .mh{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);padding:8px 11px 6px}
.menu .mi{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;width:100%;text-align:left;font-size:13.5px;color:var(--text-2);transition:background .12s,color .12s}
.menu .mi:hover{background:var(--surface-2);color:var(--text)}
.menu .mi svg{width:16px;height:16px;color:var(--text-3);flex-shrink:0}
.menu .mi:hover svg{color:var(--text-2)}
.menu .sep{height:1px;background:var(--line);margin:6px 4px}
.orgrow{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;width:100%;text-align:left;transition:background .12s}
.orgrow:hover{background:var(--surface-2)}
.orglogo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:13px;flex-shrink:0;border:1px solid var(--line-2)}
.orgrow .ot{flex:1;min-width:0}
.orgrow .on{font-size:13.5px;color:var(--text);font-weight:500;line-height:1.2;flex:1}
.orgrow .om{font-family:var(--font-mono);font-size:10px;color:var(--text-3);letter-spacing:.04em;margin-top:2px}
.orgrow .tier{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);border:1px solid var(--line-2);border-radius:4px;padding:2px 6px;line-height:1;flex-shrink:0}
.orgrow .curlbl{display:none;font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--green-ink)}
.orgrow.is-current{background:var(--green-soft)}
.orgrow.is-current .curlbl{display:inline-block}

/* ===== MAIN ===== */
.wrap{max-width:1320px;margin:0 auto;padding:30px 30px 90px}
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.orgswitch{display:flex;align-items:center;gap:11px;height:36px;padding:0 14px;border-radius:9px;background:var(--surface);border:1px solid var(--line-2);transition:border-color .15s,background .15s}
.orgswitch:hover{border-color:var(--line-3);background:var(--surface-2)}
.orgswitch .on{font-size:13.5px;color:var(--text);font-weight:600;line-height:1}
.orgswitch .chev{width:15px;height:15px;color:var(--text-3);margin-left:2px}
.tabs{display:flex;gap:3px;height:36px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.tab{display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--text-3);transition:color .15s,background .15s}
.tab:hover{color:var(--text-2)}
.tab.active{color:var(--green-ink);background:var(--maglight-soft)}
.tab .ct{font-family:var(--font-mono);font-size:11px;min-width:20px;height:18px;padding:0 6px;border-radius:6px;display:grid;place-items:center;background:var(--bg-2);color:var(--text-3);border:1px solid var(--line)}
.tab.active .ct{background:rgba(107,255,220,.18);color:var(--green-ink);border-color:var(--maglight-line)}
.tb-spacer{flex:1}
.viewtoggle{display:flex;align-items:center;gap:2px;height:36px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.vt{width:32px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--text-3);transition:.15s}
.vt:hover{color:var(--text-2)}
.vt.active{background:var(--surface-3);color:var(--text)}
.vt svg{width:16px;height:16px}
.sortbtn{display:flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--text-2);transition:.15s}
.sortbtn:hover{border-color:var(--line-3);color:var(--text)}
.sortbtn svg{width:15px;height:15px;color:var(--text-3)}
.btn-primary{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:8px;background:var(--green);color:var(--cta-text);font-size:13.5px;font-weight:600;transition:transform .12s,box-shadow .15s,filter .15s;box-shadow:0 8px 22px -8px rgba(107,255,220,.6)}
.btn-primary:hover{transform:translateY(-1px);filter:brightness(1.04)}
.btn-primary:active{transform:translateY(0)}
.btn-primary svg{width:17px;height:17px}

/* ===== GRID / CARDS ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.grid.list{grid-template-columns:1fr;gap:10px}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;overflow:hidden;transition:transform .16s,border-color .16s,box-shadow .16s;cursor:pointer;position:relative;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);border-color:var(--line-3);box-shadow:var(--card-shadow)}
.card .thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:#080a0e;border-bottom:1px solid var(--line)}
.card .thumb .thumbimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.card .thumb .glow{position:absolute;inset:0;opacity:.55;mix-blend-mode:screen;pointer-events:none}
/* top-left pill (label) — never shares a corner with the kebab (top-right) */
.pill{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;background:rgba(8,10,14,.55);backdrop-filter:blur(8px);border:1px solid;z-index:3}
.pill svg{width:12px;height:12px}
.pill.demo{border-color:var(--green-line);color:var(--green)}
.pill.migrate{border-color:var(--orange-line);color:var(--orange)}
.kebab{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:8px;display:none;place-items:center;background:rgba(8,10,14,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);color:#F2F4F7;z-index:4}
.card:hover .kebab{display:grid}
.kebab:hover{background:rgba(8,10,14,.85)}
.kebab svg{width:16px;height:16px}
.thumb .empty-thumb{position:absolute;inset:0;display:grid;place-items:center;background:var(--surface-2);z-index:0}
.thumb .empty-thumb svg{width:34px;height:34px;color:var(--line-3)}
.cardmenu{position:fixed;min-width:172px;transform-origin:top left}
.mi.danger{color:#FF5A65}
.mi.danger svg{color:#FF5A65}
.mi.danger:hover{background:rgba(255,90,101,.12);color:#FF5A65}
.card .body{padding:15px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .ttl{font-family:var(--font-display);font-weight:500;font-size:15.5px;color:var(--text);letter-spacing:-.01em;line-height:1.25}
.card .meta{font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:6px;margin-top:3px}
.card .meta svg{width:13px;height:13px;color:var(--green-ink);flex-shrink:0}
.card .facets{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.facet{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);border:1px solid var(--line);border-radius:5px;padding:3px 7px;background:var(--bg-2)}
.card .foot{margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:8px}
.card .foot.demo{padding-top:4px;gap:8px}
.card .avatars{display:flex}
.card .avatars .a{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);margin-left:-7px;display:grid;place-items:center;font-size:9px;font-weight:600;font-family:var(--font-display);color:#101828}
.card .avatars .a:first-child{margin-left:0}
.cardbtn{display:flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:8px;font-size:12.5px;font-weight:500;transition:.15s;border:1px solid transparent}
.cardbtn svg{width:14px;height:14px}
.cardbtn .mm{width:18px;height:18px}
.cardbtn.open{margin-left:auto;gap:10px;background:transparent;color:var(--text);border:1px solid var(--line-2)}
.foot.demo .cardbtn.open{margin-left:auto}
.cardbtn.open:hover{background:var(--surface-2);border-color:var(--line-3)}
.cardbtn.open .mm{width:16px;height:16px}
.cardbtn.tmpl{background:transparent;color:var(--text-2)}
.cardbtn.tmpl:hover{background:var(--surface-2);color:var(--text)}
.cardbtn.migrate{margin-left:auto;background:var(--orange-soft);color:var(--orange-ink);border-color:var(--orange-line)}
.cardbtn.migrate:hover{filter:brightness(1.05)}

/* list view */
.grid.list .card{flex-direction:row;align-items:center;border-radius:12px}
.grid.list .thumb{width:148px;aspect-ratio:16/10;flex-shrink:0;border-bottom:none;border-right:1px solid var(--line)}
.grid.list .pill,.grid.list .kebab{display:none}
.grid.list .body{flex-direction:row;align-items:center;gap:16px;padding:14px 18px}
.grid.list .facets{margin-top:0}
.grid.list .foot{margin-top:0;padding-top:0;margin-left:auto;flex-shrink:0}
.grid.list .li-main{flex:1;min-width:0}

/* new card */
.newcard{border:1.5px dashed var(--line-2);background:var(--surface-2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:240px;cursor:pointer;transition:.16s;text-align:center;padding:24px}
.newcard:hover{border-color:var(--maglight-line);background:var(--maglight-soft);transform:translateY(-3px)}
.newcard .nplus{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-2);color:var(--green-ink);transition:.16s}
.newcard:hover .nplus{background:var(--green);color:var(--cta-text);border-color:var(--green)}
.newcard .nplus svg{width:24px;height:24px}
.newcard .nt{font-family:var(--font-display);font-weight:500;font-size:15.5px;color:var(--text)}
.grid.list .newcard{flex-direction:row;min-height:0;justify-content:flex-start;gap:14px;padding:16px 18px}
.grid.list .newcard .nplus{width:40px;height:40px}

.empty{display:none;padding:60px 20px;text-align:center;color:var(--text-3)}
.empty svg{width:38px;height:38px;color:var(--line-3);margin-bottom:14px}
.empty .et{font-family:var(--font-display);font-size:17px;color:var(--text-2);margin-bottom:6px}

/* ===== MODAL ===== */
.scrim{position:fixed;inset:0;z-index:200;background:rgba(8,11,18,.6);backdrop-filter:blur(4px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .18s;padding:20px}
.scrim.open{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;box-shadow:0 40px 90px -20px rgba(0,0,0,.5);transform:translateY(10px) scale(.98);transition:transform .2s;overflow:hidden}
.scrim.open .modal{transform:none}
.modal .mtop{display:flex;align-items:center;gap:13px;padding:22px 24px;border-bottom:1px solid var(--line)}
.modal .mtop .ico{width:38px;height:38px;flex-shrink:0;display:block}
.modal .mtop .ico svg{width:100%;height:100%;display:block}
.modal .mtop h3{font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--text);letter-spacing:-.01em}
.modal .mtop p{font-size:12.5px;color:var(--text-3);margin-top:2px}
.modal .mtop .x{margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-3);transition:.15s}
.modal .mtop .x:hover{background:var(--surface-2);color:var(--text)}
.modal .mbody{padding:22px 24px}
.field{margin-bottom:18px}
.field label{display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:9px}
.field input{width:100%;height:42px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line-2);color:var(--text);font-size:14px;padding:0 14px;transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--green)}
.tmpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tmpl{border:1px solid var(--line-2);border-radius:11px;padding:13px;cursor:pointer;transition:.15s;background:var(--bg-2)}
.tmpl:hover{border-color:var(--line-3)}
.tmpl.sel{border-color:var(--green);background:var(--maglight-soft)}
.tmpl .ti{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-2);color:var(--text-2);margin-bottom:10px}
.tmpl.sel .ti{color:var(--green-ink);border-color:var(--maglight-line)}
.tmpl .tn{font-size:13px;font-weight:500;color:var(--text);font-family:var(--font-display)}
.tmpl .td{font-size:11px;color:var(--text-3);margin-top:2px;line-height:1.35}
.modal .mfoot{display:flex;align-items:center;gap:10px;padding:18px 24px;border-top:1px solid var(--line);background:var(--bg-2)}
.modal .mfoot .note{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:7px}
.modal .mfoot .note svg{width:14px;height:14px;color:var(--green-ink)}
.modal .mfoot .spc{flex:1}
.btn-ghost{height:36px;padding:0 16px;border-radius:9px;border:1px solid var(--line-2);font-size:13.5px;color:var(--text-2);font-weight:500;transition:.15s}
.btn-ghost:hover{color:var(--text);border-color:var(--line-3);background:var(--surface-2)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);z-index:300;display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:13px 18px;font-size:13.5px;color:var(--text);box-shadow:var(--card-shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast svg{width:18px;height:18px;color:var(--green-ink)}
@media (max-width:860px){ .tb-search{display:none} }
@media (max-width:760px){
  .topbar{gap:10px;padding:0 14px}
  .userbtn .un,.userbtn .chev,.hide-sm{display:none}
  .userbtn{padding:0 4px}
  .wrap{padding:18px 14px 64px}
  .toolbar{gap:10px}
  .orgswitch{order:1;flex:1 1 auto;min-width:0}
  .orgswitch .on{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn-primary{order:2}
  .tabs{order:3;width:100%}
  .tabs .tab{flex:1;justify-content:center;padding:0 6px}
  .tb-search{display:block;order:4;flex:1 1 auto;min-width:0;max-width:none}
  .viewtoggle{order:5}
  .sortbtn,.tb-spacer{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .menu{max-width:calc(100vw - 28px)}

    {n:'Demo 3 - Sphere',key:'sphere',img:'assets/demos/demo-3-sphere.png'},
    {n:'Demo 4 - Textures',key:'textures',img:'assets/demos/demo-4-textures.png'},
    {n:'Demo 5 - Mesh Luminance',key:'mesh',img:'assets/demos/demo-5-mesh-luminance.png'},
    {n:'Demo 6 - Video',key:'video',img:'assets/demos/demo-6-video.png'},
    {n:'Demo 7 - UST',key:'ust',img:'assets/demos/demo-7-ust.png'},
  ],
};
function avatars(n){let h='<div class="avatars">';for(let i=0;i<n;i++){const[t,c]=people[i%people.length];h+=`<span class="a" style="background:${c}">${t}</span>`;}return h+'</div>';}

const grid=document.getElementById('grid');
function render(tab,filter=''){
  const f=filter.trim().toLowerCase();
  const items=data[tab].filter(x=>!f||x.n.toLowerCase().includes(f)||(x.facets||[]).join(' ').toLowerCase().includes(f));
  let html='';
  items.forEach(x=>{
    const img=x.img?`<img class="thumbimg" src="${x.img}" alt="" onerror="this.remove()">`:'';
    const pill = tab==='migratable'
      ? `<span class="pill migrate">${I_CLOUD}Migrate</span>`
      : tab==='demos' ? `<span class="pill demo">Demo</span>` : '';
    const thumb=`<div class="thumb">${IMG_EMPTY}${img}${pill}<button class="kebab">${I_KEBAB}</button></div>`;
    if(tab==='demos'){
      html+=`<div class="card">${thumb}<div class="body"><div class="ttl">${x.n}</div></div></div>`;
    }else{
      const action = tab==='migratable' ? `<button class="cardbtn migrate">${I_CLOUD}Migrate</button>` : '';
      html+=`<div class="card">${thumb}<div class="body"><div class="li-main"><div class="ttl">${x.n}</div>
        <div class="meta">${x.m}</div></div>
        <div class="foot">${avatars(x.team||2)}${action}</div></div></div>`;
    }
  });
  if(tab==='mine'&&!f){
    html+=`<div class="newcard" id="newCard"><div class="nplus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div><div class="nt">New project</div></div>`;
  }
  grid.innerHTML=html;
  document.getElementById('empty').style.display=items.length?'none':'block';
  const nc=document.getElementById('newCard');if(nc)nc.addEventListener('click',openNew);
}

/* ---------- tabs ---------- */
let current='mine';
document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(!t)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');current=t.dataset.tab;
  document.getElementById('search').value='';render(current);
});
/* ---------- view ---------- */
document.getElementById('viewToggle').addEventListener('click',e=>{
  const v=e.target.closest('.vt');if(!v)return;
  document.querySelectorAll('.vt').forEach(x=>x.classList.remove('active'));
  v.classList.add('active');grid.classList.toggle('list',v.dataset.view==='list');
});
/* ---------- theme ---------- */
const root=document.documentElement;
try{const s=localStorage.getItem('mm-theme');if(s)root.dataset.theme=s;}catch(e){}
document.getElementById('themeToggle').addEventListener('click',()=>{
  const next=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=next;
  try{localStorage.setItem('mm-theme',next);}catch(e){}toast(next==='light'?'Light theme':'Dark theme');
});
/* ---------- search ---------- */
const search=document.getElementById('search');
search.addEventListener('input',()=>render(current,search.value));
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search.focus();}
  if(e.key==='Escape'){closeNew();closeMenus();}
});
/* ---------- dropdowns ---------- */
const userMenu=document.getElementById('userMenu'),orgMenu=document.getElementById('orgMenu'),cardMenu=document.getElementById('cardMenu');
function closeMenus(){userMenu.classList.remove('open');orgMenu.classList.remove('open');cardMenu.classList.remove('open');}
document.getElementById('userBtn').addEventListener('click',e=>{e.stopPropagation();orgMenu.classList.remove('open');userMenu.classList.toggle('open');});
document.getElementById('orgBtn').addEventListener('click',e=>{e.stopPropagation();userMenu.classList.remove('open');orgMenu.classList.toggle('open');});
document.addEventListener('click',closeMenus);
userMenu.addEventListener('click',e=>e.stopPropagation());
orgMenu.addEventListener('click',e=>e.stopPropagation());
orgMenu.querySelectorAll('.orgrow').forEach(row=>row.addEventListener('click',()=>{
  const org=row.dataset.org;if(!org)return;
  orgMenu.querySelectorAll('.orgrow').forEach(r=>r.classList.remove('is-current'));
  row.classList.add('is-current');
  document.querySelector('.orgswitch .on').textContent=org;
  closeMenus();toast('Switched to '+org);
}));
/* ---------- modal ---------- */
const newScrim=document.getElementById('newScrim');
function openNew(){newScrim.classList.add('open');setTimeout(()=>document.getElementById('npName').focus(),120);}
function closeNew(){newScrim.classList.remove('open');}
document.getElementById('newBtn').addEventListener('click',openNew);
document.getElementById('newClose').addEventListener('click',closeNew);
document.getElementById('newCancel').addEventListener('click',closeNew);
newScrim.addEventListener('click',e=>{if(e.target===newScrim)closeNew();});
document.querySelectorAll('.tmpl').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tmpl').forEach(x=>x.classList.remove('sel'));t.classList.add('sel');}));
document.getElementById('newCreate').addEventListener('click',()=>{const name=document.getElementById('npName').value.trim()||'Untitled project';closeNew();toast('Opening “'+name+'”…');});
/* ---------- card actions ---------- */
let menuCard=null;
grid.addEventListener('click',e=>{
  const kb=e.target.closest('.kebab');
  if(kb){e.stopPropagation();menuCard=kb.closest('.card');const r=kb.getBoundingClientRect();
    cardMenu.style.top=(r.bottom+6)+'px';cardMenu.style.left=Math.max(8,Math.min(r.right-172,window.innerWidth-184))+'px';
    userMenu.classList.remove('open');orgMenu.classList.remove('open');cardMenu.classList.add('open');return;}
  const btn=e.target.closest('.cardbtn');
  if(btn){e.stopPropagation();const name=btn.closest('.card').querySelector('.ttl').textContent;
    if(btn.classList.contains('migrate'))toast('Migrating “'+name+'”…');
    else toast('Opening “'+name+'”…');return;}
  const card=e.target.closest('.card');
  if(card)toast('Opening “'+card.querySelector('.ttl').textContent+'”…');
});
cardMenu.addEventListener('click',e=>{const mi=e.target.closest('.mi');if(!mi)return;e.stopPropagation();
  const act=mi.dataset.act,name=menuCard?menuCard.querySelector('.ttl').textContent:'';
  cardMenu.classList.remove('open');
  if(act==='Delete'&&menuCard){menuCard.remove();toast('Deleted “'+name+'”');}
  else toast(act+' “'+name+'”');});
/* ---------- toast ---------- */
let tT;const toastEl=document.getElementById('toast'),toastMsg=document.getElementById('toastMsg');
function toast(m){toastMsg.textContent=m;toastEl.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>toastEl.classList.remove('show'),2400);}
render('mine');
</script>
</body>
</html>
